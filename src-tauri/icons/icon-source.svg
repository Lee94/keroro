<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="bodyClip">
      <g transform="translate(520 540) rotate(-3)">
        <ellipse cx="-220" cy="55" rx="115" ry="180"
                 transform="rotate(-22 -220 55)"/>
        <ellipse cx="235" cy="95" rx="130" ry="205"
                 transform="rotate(22 235 95)"/>
        <ellipse cx="0" cy="0" rx="270" ry="300"/>
      </g>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#70A085"/>

  <!-- Body fills (yellow) -->
  <g transform="translate(520 540) rotate(-3)">
    <ellipse cx="-220" cy="55" rx="115" ry="180"
             transform="rotate(-22 -220 55)"
             fill="#EFD58F"/>
    <ellipse cx="235" cy="95" rx="130" ry="205"
             transform="rotate(22 235 95)"
             fill="#EFD58F"/>
    <ellipse cx="0" cy="0" rx="270" ry="300" fill="#F1DA92"/>
  </g>

  <!-- Chin shading (clipped to body) -->
  <g clip-path="url(#bodyClip)">
    <ellipse cx="510" cy="760" rx="250" ry="110" fill="#D2AD58" opacity="0.55"/>
  </g>

  <!-- Wink eye (left) -->
  <path d="M 318 458 Q 362 428 405 460 L 432 510"
        stroke="#1F1F1F" stroke-width="24"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Round eye (right) -->
  <circle cx="628" cy="488" r="92" fill="#1F1F1F"/>

  <!-- Open mouth -->
  <g transform="translate(495 624) rotate(-4)">
    <path d="M -88 -10 Q 0 -40 88 -10 Q 62 72 0 80 Q -62 72 -88 -10 Z"
          fill="#C8453F"/>
    <ellipse cx="0" cy="28" rx="58" ry="32" fill="#E68080"/>
  </g>

  <!-- Red star -->
  <g transform="translate(432 268) rotate(12) scale(0.42)">
    <path d="M 0,-50 L 16.2,-11.8 L 47.5,-15.5 L 19,6.2 L 29.4,40.5 L 0,20 L -29.4,40.5 L -19,6.2 L -47.5,-15.5 L -16.2,-11.8 Z"
          fill="#C8453F"/>
  </g>
</svg>
